  <script>
    (function () {

      // =========================================================================

      // 0: Green, 1: Pink, 2: Yellow, 3: Blue, 4: Purple
      const COLORS = [
        {

        }
      ];

      // Directions: 0 = UP, 1 = RIGHT, 2 = DOWN, 3 = LEFT
      const DIRS = [
        { dr: -1, dc: 0, name: 'UP' },
        { dr: 0, dc: 1, name: 'RIGHT' },
        { dr: 1, dc: 0, name: 'DOWN' },
        { dr: 0, dc: -1, name: 'LEFT' }
      ];

      const MAX_LOOP_CAPACITY = 150;
      const PARTICLES_PER_TILE = 18; // Each tile shatters into 18 physical 3D mini-cubes
      const TILES_PER_BOX = 2;       // 2 tiles (36 mini-cubes) fill 1 collection box (10 visual grid cells)
      const BOX_CAPACITY = PARTICLES_PER_TILE * TILES_PER_BOX; // 36 cubes per box

      // =========================================================================
      // 2. SYNTHESIZED SOUND ENGINE (Web Audio API)
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        playSlide() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.09);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }
        playBlocked() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        }
        playCrumble() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          for (let i = 0; i < 4; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(420 + i * 110 + Math.random() * 60, now + i * 0.018);
            osc.frequency.exponentialRampToValueAtTime(760 + i * 120, now + i * 0.018 + 0.05);
            gain.gain.setValueAtTime(0.06, now + i * 0.018);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.018 + 0.055);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.018);
            osc.stop(now + i * 0.018 + 0.06);
          }
        }
        playAbsorb(fillRatio) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const freq = 440 + fillRatio * 520;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
        playLidClose() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n, now + idx * 0.04);
            gain.gain.setValueAtTime(0.11, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.15);
          });
        }
        playAlarmOverflow() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          for (let i = 0; i < 3; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220 - i * 35, now + i * 0.12);
            gain.gain.setValueAtTime(0.15, now + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.11);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.12);
            osc.stop(now + i * 0.12 + 0.12);
          }
        }
      }

      const sfx = new SoundEngine();

      // =========================================================================
      // 3. LEVEL GENERATOR (Screenshot Exact Replica + Constructive Trap Levels)
      // =========================================================================
      function createRNG(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 4294967296;
        };
      }

      function isTileUnblocked(grid, rows, cols, r, c, dir) {
        const d = DIRS[dir];
        let nr = r + d.dr;
        let nc = c + d.dc;
        while (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          if (grid[nr][nc] !== null) return false;
          nr += d.dr;
          nc += d.dc;
        }
        return true;
      }

      function findBlockingCell(grid, rows, cols, r, c, dir) {
        const d = DIRS[dir];
        let nr = r + d.dr;
        let nc = c + d.dc;
        while (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          if (grid[nr][nc] !== null) return { r: nr, c: nc };
          nr += d.dr;
          nc += d.dc;
        }
        return null;
      }

      // Level 15 Exact Replica of `image_5fb518.jpg`!
      // Look at `image_5fb518.jpg`:
      // - 26 remaining tiles on the 6x6 board (exact colors and arrows from screenshot!)
      // - Plus 63 cubes ALREADY tumbling in the Loop track & right funnel slope (32 Blue + 31 Pink = 63/150!)
      // - Plus the 4 bottom columns starting with `[Pink (partially filled), Pink (closing/next), Blue (partially filled), Yellow (empty)]`!
      function buildScreenshotReplicaLevel(startWithLiveAction = true) {
        const rows = 6, cols = 6;
        // Exact 6x6 board from image_5fb518.jpg:
        // Color IDs: 0=Green, 1=Pink, 2=Yellow, 3=Blue, 4=Purple
        // Dir IDs: 0=UP, 1=RIGHT, 2=DOWN, 3=LEFT
        const rawLayout = [
          [ [0,0], [0,1], [2,0], null,  [2,1], [4,0] ],
          [ [1,0], [2,3], [1,0], [1,1], [4,0], [3,0] ],
          [ [0,0], [3,0], [4,1], [0,0], [1,0], [0,1] ],
          [ [4,3], [1,0], [0,1], [2,0], [2,0], [3,0] ],
          [ [4,2], [3,3], [2,2], [4,0], null,  null  ],
          [ null,  [4,2], null,  null,  null,  null  ]
        ];

        const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
        const colorCounts = [0, 0, 0, 0, 0];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const item = rawLayout[r][c];
            if (item) {
              grid[r][c] = {
                id: `t_${r}_${c}`,
                r,
                c,
                colorId: item[0],
                dir: item[1],
                bumpTimer: 0,
                bumpDir: 0,
                highlightTimer: 0
              };
              colorCounts[item[0]] += PARTICLES_PER_TILE;
            }
          }
        }
        // Color counts on board (26 tiles * 18 = 468 cubes):
        // Green(0): 6 tiles = 108 cubes (3 boxes of 36)
        // Pink(1):  5 tiles = 90 cubes
        // Yellow(2):6 tiles = 108 cubes (3 boxes of 36)
        // Blue(3):  4 tiles = 72 cubes (2 boxes of 36)
        // Purple(4):5 tiles = 90 cubes

        // In the live screenshot scene, 1 Pink tile (18 cubes) + 1.5 Pink/Blue tiles are already in the Loop/Funnel:
        // Specifically, let's make sure the total cubes (Board + initial Loop/Funnel + already in active boxes)
        // equals the exact capacity of the queued boxes in the 4 columns so every single cube gets collected cleanly at Victory!
        // Let's check:
        // On board:
        // - Green(0): 6 tiles (108 cubes) -> 3 Green boxes
        // - Yellow(2): 6 tiles (108 cubes) -> 3 Yellow boxes
        // - Pink(1): 5 tiles on board (90 cubes) + 18 Pink cubes currently on bottom Loop track = 108 Pink cubes -> 3 Pink boxes!
        // - Blue(3): 4 tiles on board (72 cubes) + 36 Blue cubes currently in right funnel & top Loop track = 108 Blue cubes -> 3 Blue boxes!
        // - Purple(4): 5 tiles on board (90 cubes) + 18 Purple/Pink? Wait: let's give Purple 6 tiles or 5 tiles (90 cubes = 2 boxes of 36 + 1 box of 18, or let's make `(5,0)` or `(4,4)` none and let the 3rd Purple box have capacity 18, or add 18 pre-filled slots!).
        // Even cleaner: if we pre-fill 18 cubes in the first Pink box (`filled = 18/36`), and put 18 Pink cubes on the bottom Loop track, then that first Pink box needs those 18 Loop cubes to finish (`36/36`)!
        // And the remaining 5 Pink tiles on the board (`90` cubes) fill 2.5 boxes -> if we put 18 more Pink cubes on the Loop track (`18 + 18 = 36` Pink cubes on the Loop track!), then:
        // - First Pink box (Col 0): already has `18/36` filled, absorbs `18` Pink cubes from Loop track -> closes!
        // - Second Pink box (Col 1): already has `18/36` filled, absorbs the other `18` Pink cubes from Loop track -> closes!
        // - Wait: look at `image_5fb518.jpg`!
        //   In `image_5fb518.jpg`, Col 0 is a Pink box, Col 1 is a Pink box, Col 2 is a Blue box, Col 3 is a Yellow box!
        //   And there are ~31 Pink cubes on the bottom Loop track + ~32 Blue cubes on the top Loop track & right funnel (`31 + 32 = 63` cubes on the Loop track -> `63/150`!!)!
        // Let's make the exact box math add up to the single cube so 100% of cubes clear at the end of the level:
        // - Pink on board: 5 tiles = 90 cubes. Plus 31 Pink cubes on Loop track = 121 Pink cubes.
        //   If Col 0 Pink box starts with `23/36` filled (needs 13 more), and Col 1 Pink box starts with `0/36` (needs 36), plus 2 more Pink boxes in queue (`2 * 36 = 72`): `13 + 36 + 72 = 121` Pink cubes!
        // - Blue on board: 4 tiles = 72 cubes. Plus 32 Blue cubes in Funnel/Loop = 104 Blue cubes.
        //   Col 2 Blue box starts with `4/36` filled (needs 32 more, matching the 2 blue cells filled in `image_5fb518.jpg`!), plus 2 more Blue boxes in queue (`2 * 36 = 72`): `32 + 72 = 104` Blue cubes!
        // - Yellow on board: 6 tiles = 108 cubes -> 3 Yellow boxes (`3 * 36 = 108`, starting with Col 3 Yellow box `0/36`)!
        // - Green on board: 6 tiles = 108 cubes -> 3 Green boxes (`3 * 36 = 108`)!
        // - Purple on board: 5 tiles = 90 cubes -> 2 Purple boxes of 36 (`72`) + 1 Purple box pre-filled `18/36` (needs `18`): `72 + 18 = 90` Purple cubes!
        // LOOK AT THAT MATH:
        // Every single color (`Pink: 121`, `Blue: 104`, `Yellow: 108`, `Green: 108`, `Purple: 90`) sums to the EXACT capacity of its boxes, AND the initial Loop + Funnel particle count is literally `31 + 32 = 63` (`63/150`), AND the 4 active boxes at the bottom are literally `[Pink, Pink, Blue, Yellow]` just like `image_5fb518.jpg`!

        const makeBox = (id, colorId, initialFilled = 0) => ({
          id,
          colorId,
          capacity: BOX_CAPACITY,
          filled: initialFilled,
          reserved: initialFilled,
          lidState: 'OPEN', // 'OPEN' | 'CLOSING' | 'DONE'
          lidProgress: 0,
          slideOffset: 0,
          intakeTimer: 0,
          sparkles: []
        });

        // Active top row matching image_5fb518.jpg:
        // Col 0: Pink (28/36 filled = 8 visual slots + sparkles)
        // Col 1: Bonus pre-packed Pink box mid-lid-close right above the next Pink box (or 31/36 filled)
        // Col 2: Blue (7/36 filled = 2 left visual slots + sparkles)
        // Col 3: Yellow (0/36 empty)
        const closingPinkBox = makeBox('c1_top_closing', 1, 36);
        closingPinkBox.lidState = 'CLOSING';
        closingPinkBox.lidProgress = 0.58; // Shows the iconic 3D Pink Lid snapping shut in Col 1!

        const columns = [
          // Col 0: Pink(23/36, needs 13) -> Green(0/36) -> Pink(0/36, needs 36) -> Purple(0/36)
          [makeBox('c0_0', 1, 23), makeBox('c0_1', 0, 0), makeBox('c0_2', 1, 0), makeBox('c0_3', 4, 0)],
          // Col 1: Closing Pink Box(36/36) -> Pink(0/36, needs 36) -> Yellow(0/36) -> Green(0/36) -> Purple(18/36, needs 18)
          [closingPinkBox, makeBox('c1_0', 1, 0), makeBox('c1_1', 2, 0), makeBox('c1_2', 0, 0), makeBox('c1_3', 4, 18)],
          // Col 2: Blue(4/36, needs 32) -> Pink(0/36, needs 36) -> Blue(0/36) -> Green(0/36)
          [makeBox('c2_0', 3, 4),  makeBox('c2_1', 1, 0), makeBox('c2_2', 3, 0), makeBox('c2_3', 0, 0)],
          // Col 3: Yellow(0/36) -> Blue(0/36) -> Yellow(0/36) -> Purple(0/36)
          [makeBox('c3_0', 2, 0),  makeBox('c3_1', 3, 0), makeBox('c3_2', 2, 0), makeBox('c3_3', 4, 0)]
        ];

        return {
          grid,
          columns,
          rows,
          cols,
          initialPinkOnLoop: startWithLiveAction ? 31 : 0,
          initialBlueInFunnelAndLoop: startWithLiveAction ? 32 : 0
        };
      }

      // Procedural Strategic Level Generator using our proven Perimeter Trap + Reverse-Peeling Theorem
      function buildProceduralStrategicLevel(levelNum, seed) {
        const rows = 6, cols = 6, numColors = 5;
        const rng = createRNG(seed);

        const activeCells = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            activeCells.push({ r, c });
          }
        }
        const totalTiles = activeCells.length;
        const numBoxes = Math.floor(totalTiles / TILES_PER_BOX);

        const perimeterCandidates = [];
        for (const { r, c } of activeCells) {
          const outDirs = [];
          if (r === 0) outDirs.push(0);
          if (c === cols - 1) outDirs.push(1);
          if (r === rows - 1) outDirs.push(2);
          if (c === 0) outDirs.push(3);
          if (outDirs.length > 0) {
            perimeterCandidates.push({ r, c, outDir: outDirs[Math.floor(rng() * outDirs.length)] });
          }
        }
        for (let i = perimeterCandidates.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          const t = perimeterCandidates[i];
          perimeterCandidates[i] = perimeterCandidates[j];
          perimeterCandidates[j] = t;
        }
        const numTraps = 8;
        const trapSet = new Set();
        const trapMap = new Map();
        for (let i = 0; i < numTraps; i++) {
          const key = `${perimeterCandidates[i].r}_${perimeterCandidates[i].c}`;
          trapSet.add(key);
          trapMap.set(key, perimeterCandidates[i].outDir);
        }

        const occupied = Array.from({ length: rows }, () => Array(cols).fill(true));
        const assignedDir = Array.from({ length: rows }, () => Array(cols).fill(0));
        const peelOrder = [];

        let rem = totalTiles;
        while (rem > 0) {
          const nonTrapLeft = rem > trapSet.size;
          let candidates = [];
          for (let i = 0; i < activeCells.length; i++) {
            const { r, c } = activeCells[i];
            if (!occupied[r][c]) continue;
            const key = `${r}_${c}`;
            if (nonTrapLeft && trapSet.has(key)) continue;

            const validDirs = [];
            for (let d = 0; d < 4; d++) {
              const { dr, dc } = DIRS[d];
              let nr = r + dr, nc = c + dc;
              let clear = true;
              while (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                if (occupied[nr][nc]) { clear = false; break; }
                nr += dr; nc += dc;
              }
              if (clear) validDirs.push(d);
            }
            if (validDirs.length > 0) candidates.push({ r, c, key, validDirs });
          }
          if (candidates.length === 0) {
            for (let i = 0; i < activeCells.length; i++) {
              const { r, c } = activeCells[i];
              if (!occupied[r][c]) continue;
              const key = `${r}_${c}`;
              const validDirs = [];
              for (let d = 0; d < 4; d++) {
                const { dr, dc } = DIRS[d];
                let nr = r + dr, nc = c + dc;
                let clear = true;
                while (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  if (occupied[nr][nc]) { clear = false; break; }
                  nr += dr; nc += dc;
                }
                if (clear) validDirs.push(d);
              }
              if (validDirs.length > 0) candidates.push({ r, c, key, validDirs });
            }
          }

          const pick = candidates[Math.floor(rng() * candidates.length)];
          let chosenDir;
          if (trapMap.has(pick.key) && pick.validDirs.includes(trapMap.get(pick.key))) {
            chosenDir = trapMap.get(pick.key);
          } else {
            const deepDirs = pick.validDirs.filter(d => {
              const { dr, dc } = DIRS[d];
              const dist = dr === -1 ? pick.r : dr === 1 ? (rows - 1 - pick.r) : dc === -1 ? pick.c : (cols - 1 - pick.c);
              return dist >= 2;
            });
            const pool = deepDirs.length > 0 ? deepDirs : pick.validDirs;
            chosenDir = pool[Math.floor(rng() * pool.length)];
          }
          assignedDir[pick.r][pick.c] = chosenDir;
          occupied[pick.r][pick.c] = false;
          peelOrder.push({ r: pick.r, c: pick.c });
          rem--;
        }

        const colorPerm = [0, 1, 2, 3, 4];
        for (let i = colorPerm.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          const t = colorPerm[i]; colorPerm[i] = colorPerm[j]; colorPerm[j] = t;
        }
        const earlyColors = [colorPerm[0], colorPerm[1], colorPerm[2]];
        const lateColors = [colorPerm[3], colorPerm[4]];

        const columns = [[], [], [], []];
        const boxSequence = [];
        const earlyBoxCount = Math.max(4, numBoxes - 5);
        for (let b = 0; b < numBoxes; b++) {
          const cid = b < earlyBoxCount
            ? earlyColors[(b + Math.floor(rng() * 2)) % earlyColors.length]
            : lateColors[b % lateColors.length];
          const boxObj = {
            id: `b_${b}`,
            colorId: cid,
            capacity: BOX_CAPACITY,
            filled: 0,
            reserved: 0,
            lidState: 'OPEN',
            lidProgress: 0,
            slideOffset: 0,
            intakeTimer: 0,
            sparkles: []
          };
          boxSequence.push(boxObj);
          columns[b % 4].push(boxObj);
        }

        const tileColors = [];
        for (let b = 0; b < numBoxes; b++) {
          for (let k = 0; k < TILES_PER_BOX; k++) {
            tileColors.push(boxSequence[b].colorId);
          }
        }
        for (let i = 0; i + 2 < earlyBoxCount * TILES_PER_BOX; i += 3) {
          if (rng() < 0.55) {
            const t = tileColors[i];
            tileColors[i] = tileColors[i + 1];
            tileColors[i + 1] = t;
          }
        }

        const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
        for (let i = 0; i < peelOrder.length; i++) {
          const { r, c } = peelOrder[i];
          grid[r][c] = {
            id: `t_${r}_${c}`,
            r,
            c,
            colorId: tileColors[i],
            dir: assignedDir[r][c],
            bumpTimer: 0,
            bumpDir: 0,
            highlightTimer: 0
          };
        }

        return {
          grid,
          columns,
          rows,
          cols,
          initialPinkOnLoop: 0,
          initialBlueInFunnelAndLoop: 0
        };
      }

      // =========================================================================
      // 4. GAME STATE & 1:1 GEOMETRY LAYOUT ENGINE
      // =========================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('canvasContainer');

      let currentLevelNum = 15;

      let state = {
        levelNum: 15,
        rows: 6,
        cols: 6,
        grid: [],
        exitingTiles: [], // Tiles sliding off the dark board toward the outer U-trough where they shatter
        particles: [],    // Physical 2D rigid-body mini-cubes in 'FUNNEL' or 'LOOP'
        leapingCubes: [], // Cubes leaping from bottom Loop corridor into matching box slots
        fxParticles: [],  // Confetti and sparks
        columns: [[], [], [], []],
        handPointer: {
          visible: true,
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          bobPhase: 0,
          tapAnim: 0
        },
        gameOver: false,
        victory: false,
        botMode: null, // null | 'strategic' | 'blind'
        botTimer: 0,
        overflowShake: 0
      };

      let layout = {
        w: 420,
        h: 720,
        dpr: 1,
        // Upper U-funnel & Dark Board
        funnelOuter: { x: 0, y: 0, w: 0, topH: 0, bowlBottomY: 0, neckW: 54, neckBottomY: 0 },
        board: { x: 0, y: 0, w: 0, h: 0, r: 26, cellSize: 44, gridX: 0, gridY: 0 },
        // Middle Stadium Loop Track
        loop: {
          x: 0, y: 0, w: 0, h: 0,
          cx: 0, cy: 0,
          halfFlatW: 110,
          outerR: 54,
          innerR: 12,
          trackWidth: 38,
          slotBar: { x: 0, y: 0, w: 0, h: 20 },
          pill: { x: 0, y: 0, w: 102, h: 34 }
        },
        // Bottom 4 Collection Box Columns
        boxes: { startX: 0, startY: 0, boxW: 82, boxH: 54, gapX: 8, gapY: 8 },
        cubeSize: 11.5,
        cubeRadius: 5.8
      };

      function computeLayout() {
        const rect = container.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.max(320, Math.min(450, Math.floor(rect.width)));
        const h = Math.max(520, Math.floor(rect.height));

        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        layout.w = w;
        layout.h = h;
        layout.dpr = dpr;

        // 1. Upper Board & White-Lavender U-Shaped Funnel
        const topPad = 6;
        const troughSideW = Math.max(24, Math.floor(w * 0.064));
        const maxBoardW = w - 22 - troughSideW * 2;
        const maxBoardH = Math.floor(h * 0.44);

        const boardPad = 13;
        const cellSize = Math.max(30, Math.min(46, Math.floor(Math.min(maxBoardW - boardPad * 2, maxBoardH - boardPad * 2) / 6)));
        const gridW = cellSize * state.cols;
        const gridH = cellSize * state.rows;
        const boardW = gridW + boardPad * 2;
        const boardH = gridH + boardPad * 2 + 14;
        const boardX = Math.floor((w - boardW) / 2);
        const boardY = topPad + Math.floor(troughSideW * 0.72);

        layout.board = {
          x: boardX,
          y: boardY,
          w: boardW,
          h: boardH,
          r: 26,
          cellSize,
          gridX: boardX + boardPad,
          gridY: boardY + boardPad - 2
        };

        const funnelW = boardW + troughSideW * 2;
        const funnelX = Math.floor((w - funnelW) / 2);
        const funnelY = topPad;
        const bowlStraightBottomY = boardY + boardH - 6;
        const bowlBottomY = boardY + boardH + Math.max(40, Math.floor(h * 0.064));
        const neckW = Math.max(54, Math.floor(cellSize * 1.32));
        const neckBottomY = bowlBottomY + 16;

        layout.funnelOuter = {
          x: funnelX,
          y: funnelY,
          w: funnelW,
          troughSideW,
          bowlStraightBottomY,
          bowlBottomY,
          neckW,
          neckBottomY
        };

        // 2. Middle Stadium Loop Track (White-Lavender Stadium with Dark Center Slot Bar & 63/150 Pill)
        const loopW = Math.min(w - 16, funnelW + 14);
        const loopH = Math.max(92, Math.min(116, Math.floor(h * 0.155)));
        const loopX = Math.floor((w - loopW) / 2);
        const loopY = neckBottomY - 4;
        const outerR = Math.floor(loopH / 2);
        const halfFlatW = Math.floor((loopW - outerR * 2) / 2);
        const slotBarH = Math.max(16, Math.floor(loopH * 0.19));
        const slotBarW = halfFlatW * 2 + Math.floor(outerR * 0.85);
        const cx = Math.floor(w / 2);
        const cy = loopY + outerR;

        layout.loop = {
          x: loopX,
          y: loopY,
          w: loopW,
          h: loopH,
          cx,
          cy,
          halfFlatW,
          outerR,
          innerR: Math.floor(slotBarH / 2),
          trackWidth: outerR - Math.floor(slotBarH / 2),
          slotBar: {
            x: Math.floor(cx - slotBarW / 2),
            y: Math.floor(cy - slotBarH / 2),
            w: slotBarW,
            h: slotBarH
          },
          pill: {
            x: Math.floor(cx - 52),
            y: Math.floor(cy - 17),
            w: 104,
            h: 34
          }
        };

        // 3. Bottom 4 Collection Box Columns
        const boxesStartY = loopY + loopH + 5;
        const totalBoxesW = Math.min(w - 14, loopW);
        const gapX = 7;
        const boxW = Math.floor((totalBoxesW - gapX * 3) / 4);
        const boxH = Math.max(44, Math.min(58, Math.floor(boxW * 0.66)));
        const boxesStartX = Math.floor((w - (boxW * 4 + gapX * 3)) / 2);

        layout.boxes = {
          startX: boxesStartX,
          startY: boxesStartY,
          boxW,
          boxH,
          gapX,
          gapY: 8
        };

        layout.cubeSize = Math.max(10, Math.min(13.5, cellSize * 0.29));
        layout.cubeRadius = layout.cubeSize * 0.47;
      }

      // =========================================================================
      // 5. INITIALIZE LEVEL & SPAWN INITIAL 63/150 SCENE PARTICLES
      // =========================================================================
      function initLevel(levelNum) {
        currentLevelNum = levelNum;
        state.levelNum = levelNum;
        state.exitingTiles = [];
        state.particles = [];
        state.leapingCubes = [];
        state.fxParticles = [];
        state.gameOver = false;
        state.victory = false;
        state.botMode = null;
        state.overflowShake = 0;
        updateBotButtons();

        let built;
        if (levelNum === 15) {
          built = buildScreenshotReplicaLevel(true);
          document.getElementById('levelLabel').textContent = 'Level 15 (原图复刻)';
        } else {
          built = buildProceduralStrategicLevel(levelNum, levelNum * 4099 + 17);
          document.getElementById('levelLabel').textContent = `Level ${levelNum}`;
        }

        state.rows = built.rows;
        state.cols = built.cols;
        state.grid = built.grid;
        state.columns = built.columns;

        computeLayout();

        // Populate initial sparkles inside pre-filled box slots
        for (let col = 0; col < 4; col++) {
          const topBox = state.columns[col][0];
          if (topBox && topBox.filled > 0) {
            for (let s = 0; s < 6; s++) {
              topBox.sparkles.push({
                rx: 0.15 + Math.random() * 0.7,
                ry: 0.2 + Math.random() * 0.6,
                phase: Math.random() * Math.PI * 2
              });
            }
          }
        }

        // If Level 15 (Screenshot Replica), spawn the exact 31 Pink cubes on bottom Loop track
        // and 32 Blue cubes in the right U-funnel slope & top Loop track (31 + 32 = 63/150)!
        if (built.initialPinkOnLoop > 0 || built.initialBlueInFunnelAndLoop > 0) {
          const lp = layout.loop;
          const fn = layout.funnelOuter;
          const rng = createRNG(15518);

          // 31 Pink cubes piled along the bottom-left / bottom-center of the Loop track (above Col 0 & Col 1 Pink boxes)
          for (let i = 0; i < built.initialPinkOnLoop; i++) {
            const px = lp.cx - lp.halfFlatW * 0.92 + (i / built.initialPinkOnLoop) * (lp.halfFlatW * 1.15) + (rng() - 0.5) * 14;
            const py = lp.cy + lp.innerR + 7 + (rng() * (lp.trackWidth - 13));
            state.particles.push({
              x: px,
              y: py,
              vx: 15 + (rng() - 0.5) * 20,
              vy: (rng() - 0.5) * 10,
              angle: rng() * Math.PI * 2,
              omega: (rng() - 0.5) * 2,
              colorId: 1, // Pink
              zone: 'LOOP',
              age: 2.0
            });
          }

          // 32 Blue cubes: 15 cascading diagonally along the lower-right U-funnel curve + 17 piled across the top Loop corridor!
          for (let i = 0; i < built.initialBlueInFunnelAndLoop; i++) {
            if (i < 15) {
              const frac = i / 14;
              const startX = fn.x + fn.w - fn.troughSideW * 0.48;
              const endX = lp.cx + fn.neckW * 0.28;
              const px = endX + (startX - endX) * frac + (rng() - 0.5) * 9;
              const startY = fn.bowlStraightBottomY - 26;
              const endY = fn.neckBottomY - 2;
              const py = endY - (endY - startY) * Math.pow(frac, 0.82) + (rng() - 0.5) * 6;
              state.particles.push({
                x: px,
                y: py,
                vx: -35,
                vy: 45,
                angle: rng() * Math.PI * 2,
                omega: (rng() - 0.5) * 4,
                colorId: 3, // Blue
                zone: 'FUNNEL',
                age: 0.5
              });
            } else {
              // Piled along the top Loop corridor (`63/150` top blue cluster!)
              const k = i - 13;
              const px = lp.cx - lp.halfFlatW * 0.95 + (k / 19) * (lp.halfFlatW * 1.45) + (rng() - 0.5) * 14;
              const py = lp.cy - lp.innerR - 7 - rng() * (lp.trackWidth - 13);
              state.particles.push({
                x: px,
                y: py,
                vx: -25 + (rng() - 0.5) * 20,
                vy: (rng() - 0.5) * 10,
                angle: rng() * Math.PI * 2,
                omega: (rng() - 0.5) * 2,
                colorId: 3, // Blue
                zone: 'LOOP',
                age: 2.0
              });
            }
          }
        }

        // Position the 3D white cartoon glove hand at the lower-right of the dark board (just like image_5fb518.jpg!)
        const handPos = getTileScreenCenter(4, 4.4);
        state.handPointer.x = handPos.x;
        state.handPointer.y = handPos.y + 18;
        state.handPointer.targetX = state.handPointer.x;
        state.handPointer.targetY = state.handPointer.y;
        state.handPointer.visible = true;

        document.getElementById('modalOverlay').classList.add('hidden');
        updateHUDCounters();
      }

      function getTileScreenCenter(r, c) {
        const b = layout.board;
        return {
          x: b.gridX + (c + 0.5) * b.cellSize,
          y: b.gridY + (r + 0.5) * b.cellSize
        };
      }

      // =========================================================================
      // 6. TILE CLICK -> SLIDE OFF BOARD -> CRUMBLE IN OUTER TROUGH INTO 18 CUBES
      // =========================================================================
      function tryActivateTile(r, c) {
        if (state.gameOver || state.victory) return false;
        const tile = state.grid[r] && state.grid[r][c];
        if (!tile) return false;

        // Move cartoon glove hand to clicked tile
        const center = getTileScreenCenter(r, c);
        state.handPointer.targetX = center.x + 14;
        state.handPointer.targetY = center.y + 22;
        state.handPointer.tapAnim = 1.0;
        state.handPointer.visible = true;

        if (isTileUnblocked(state.grid, state.rows, state.cols, r, c, tile.dir)) {
          state.grid[r][c] = null;
          sfx.playSlide();

          const d = DIRS[tile.dir];
          const b = layout.board;
          const fn = layout.funnelOuter;

          // Compute exact exit coordinate where the tile hits the outer white-lavender trough!
          let targetX = center.x;
          let targetY = center.y;
          if (tile.dir === 0) targetY = fn.y + fn.troughSideW * 0.55;
          else if (tile.dir === 1) targetX = fn.x + fn.w - fn.troughSideW * 0.55;
          else if (tile.dir === 2) targetY = b.y + b.h + 14;
          else if (tile.dir === 3) targetX = fn.x + fn.troughSideW * 0.55;

          state.exitingTiles.push({
            colorId: tile.colorId,
            dir: tile.dir,
            x: center.x,
            y: center.y,
            targetX,
            targetY,
            vx: d.dc * Math.max(520, b.cellSize * 13),
            vy: d.dr * Math.max(520, b.cellSize * 13)
          });
          return true;
        } else {
          // Blocked! Tactile bump recoil
          sfx.playBlocked();
          tile.bumpTimer = 1.0;
          tile.bumpDir = tile.dir;

          const blocker = findBlockingCell(state.grid, state.rows, state.cols, r, c, tile.dir);
          if (blocker && state.grid[blocker.r][blocker.c]) {
            state.grid[blocker.r][blocker.c].highlightTimer = 1.0;
          }
          return false;
        }
      }

      // Crumbles an exiting tile right inside the outer white-lavender U-trough into 18 physical 3D mini-cubes!
      function crumbleTileInTrough(exTile) {
        sfx.playCrumble();
        const cs = layout.board.cellSize * 0.85;
        const cols = 4;
        const rows = 5; // 4x5 minus 2 = 18 physical mini-cubes!
        let spawned = 0;

        const isVertExit = (exTile.dir === 0 || exTile.dir === 2);
        const spreadX = isVertExit ? cs * 0.95 : cs * 0.42;
        const spreadY = isVertExit ? cs * 0.42 : cs * 0.95;
        for (let rr = 0; rr < rows && spawned < PARTICLES_PER_TILE; rr++) {
          for (let cc = 0; cc < cols && spawned < PARTICLES_PER_TILE; cc++) {
            const ox = ((cc / (cols - 1)) - 0.5) * spreadX + (Math.random() - 0.5) * 2.5;
            const oy = ((rr / (rows - 1)) - 0.5) * spreadY + (Math.random() - 0.5) * 2.5;
            state.particles.push({
              x: exTile.x + ox,
              y: exTile.y + oy,
              vx: exTile.vx * 0.15 + (Math.random() - 0.5) * 70,
              vy: Math.max(20, exTile.vy * 0.15) + Math.random() * 55,
              angle: Math.random() * Math.PI * 2,
              omega: (Math.random() - 0.5) * 6,
              colorId: exTile.colorId,
              zone: 'FUNNEL',
              age: 0
            });
            spawned++;
          }
        }
      }

      // =========================================================================
      // 7. 240Hz PBD GRANULAR RIGID-BODY PHYSICS ENGINE (Funnel + Loop Track)
      // =========================================================================
      function stepPhysics(dt) {
        const SUBSTEPS = 4;
        const subDt = dt / SUBSTEPS;
        const rad = layout.cubeRadius;
        const minDist = rad * 1.92; // Physical cube-cube contact diameter
        const minDistSq = minDist * minDist;

        const fn = layout.funnelOuter;
        const b = layout.board;
        const lp = layout.loop;

        for (let step = 0; step < SUBSTEPS; step++) {
          const N = state.particles.length;

          // 1. Apply Forces (Gravity in U-Funnel, Conveyor Flow Field in Stadium Loop Track)
          for (let i = 0; i < N; i++) {
            const p = state.particles[i];
            p.age += subDt;

            if (p.zone === 'FUNNEL') {
              // Smooth perimeter chute & U-bowl gravity flow around the rounded dark board
              if (p.y < b.y + b.r * 1.1) {
                // Top trough & upper corners: sweep swiftly outward and downward into the left/right vertical chutes!
                const dirSign = p.x < lp.cx ? -1 : 1;
                const sideChuteX = dirSign < 0 ? (fn.x + b.x) * 0.5 : (b.x + b.w + fn.x + fn.w) * 0.5;
                const distToSide = Math.abs(p.x - sideChuteX);
                if (distToSide < fn.troughSideW * 1.35) {
                  p.vx += (sideChuteX - p.x) * 14.0 * subDt;
                  p.vy += (360 - p.vy) * 10.0 * subDt;
                } else {
                  const topChuteY = (fn.y + b.y) * 0.5;
                  p.vx += (dirSign * 350 - p.vx) * 10.0 * subDt;
                  p.vy += (topChuteY - p.y) * 10.0 * subDt;
                }
              } else if (p.y < b.y + b.h - b.r * 0.4) {
                // Left or right vertical side chute: brisk downward waterfall flow!
                const sideChuteX = p.x < lp.cx ? (fn.x + b.x) * 0.5 : (b.x + b.w + fn.x + fn.w) * 0.5;
                p.vx += (sideChuteX - p.x) * 12.0 * subDt;
                p.vy += (360 - p.vy) * 9.0 * subDt;
              } else {
                // Inside the curved U-bowl below the dark board: cascade diagonally along the bowl toward central throat
                const dxToCenter = lp.cx - p.x;
                p.vx += dxToCenter * 5.4 * subDt;
                p.vy += 490 * subDt;
              }

              p.vx *= 0.985;
              p.vy *= 0.985;
              p.x += p.vx * subDt;
              p.y += p.vy * subDt;
              p.angle += p.omega * subDt;

              // True Rounded-Rectangle Signed Distance Field (SDF) for the inner dark board (`b`)!
              // Cubes glide smoothly around the 4 rounded corners of `b` without ever catching on a 90-degree edge.
              const cornerR = b.r + 4;
              const coreMinX = b.x + cornerR - 4;
              const coreMaxX = b.x + b.w - cornerR + 4;
              const coreMinY = b.y + cornerR - 4;
              const coreMaxY = b.y + b.h - cornerR + 4;

              const clampedBX = Math.max(coreMinX, Math.min(coreMaxX, p.x));
              const clampedBY = Math.max(coreMinY, Math.min(coreMaxY, p.y));
              const dbx = p.x - clampedBX;
              const dby = p.y - clampedBY;
              const distFromCore = Math.hypot(dbx, dby);
              const minClearance = cornerR + rad + 1.5;

              if (distFromCore < minClearance) {
                if (distFromCore > 0.001) {
                  const nx = dbx / distFromCore;
                  const ny = dby / distFromCore;
                  p.x = clampedBX + nx * minClearance;
                  p.y = clampedBY + ny * minClearance;
                  // Remove inward normal velocity component so particle slides tangentially around the rounded corner
                  const vn = p.vx * nx + p.vy * ny;
                  if (vn < 0) {
                    p.vx -= vn * nx;
                    p.vy -= vn * ny;
                  }
                } else {
                  // Fallback if deep inside core: push out to nearest side
                  const dirSign = p.x < lp.cx ? -1 : 1;
                  p.x = dirSign < 0 ? b.x - rad - 3 : b.x + b.w + rad + 3;
                }
              }

              // Keep inside the outer white-lavender U-funnel walls (`fn`)
              const wallPad = rad + 5;
              if (p.y < fn.y + wallPad) {
                p.y = fn.y + wallPad;
                p.vy = Math.abs(p.vy) * 0.3;
              }
              if (p.y <= fn.bowlStraightBottomY) {
                if (p.x < fn.x + wallPad) { p.x = fn.x + wallPad; p.vx = Math.abs(p.vx) * 0.4; }
                if (p.x > fn.x + fn.w - wallPad) { p.x = fn.x + fn.w - wallPad; p.vx = -Math.abs(p.vx) * 0.4; }
              } else if (p.y <= fn.bowlBottomY) {
                // Smooth curved U-bowl tapering from `fn.w / 2` down to `fn.neckW / 2`!
                const t = (p.y - fn.bowlStraightBottomY) / Math.max(1, fn.bowlBottomY - fn.bowlStraightBottomY);
                const curve = Math.pow(t, 1.35);
                const halfSpan = (fn.w / 2) * (1 - curve) + (fn.neckW / 2) * curve - wallPad;
                const minX = lp.cx - halfSpan;
                const maxX = lp.cx + halfSpan;
                if (p.x < minX) {
                  p.x = minX;
                  // Slide tangentially down the right/left funnel slope!
                  p.vx = Math.max(p.vx, 45);
                  p.omega += 0.25;
                } else if (p.x > maxX) {
                  p.x = maxX;
                  p.vx = Math.min(p.vx, -45);
                  p.omega -= 0.25;
                }
              } else {
                // Inside the vertical throat leading into the Loop track
                const halfNeck = fn.neckW / 2 - wallPad;
                if (p.x < lp.cx - halfNeck) { p.x = lp.cx - halfNeck; p.vx = Math.abs(p.vx) * 0.2; }
                if (p.x > lp.cx + halfNeck) { p.x = lp.cx + halfNeck; p.vx = -Math.abs(p.vx) * 0.2; }
              }

              // Transition from FUNNEL throat into the Stadium LOOP track!
              if (p.y >= lp.y + rad + 4) {
                p.zone = 'LOOP';
                p.vx = -55 + (Math.random() - 0.5) * 30;
              }
            } else {
              // ZONE === 'LOOP': Inside the Stadium Racetrack Corridor!
              // Determine closest point on the stadium spine (horizontal segment `[-halfFlatW, +halfFlatW]` at `lp.cy`)
              const clampedX = Math.max(lp.cx - lp.halfFlatW, Math.min(lp.cx + lp.halfFlatW, p.x));
              const rx = p.x - clampedX;
              const ry = p.y - lp.cy;
              const distFromSpine = Math.hypot(rx, ry) || 0.001;
              const nx = rx / distFromSpine;
              const ny = ry / distFromSpine;

              // Counter-clockwise racetrack conveyor flow:
              // Give a brisker tangential speed around the left/right turns so cubes never bunch up at the turn corners,
              // and spread evenly across the top and bottom horizontal corridors!
              const tx = ny;
              const ty = -nx;
              const inTurn = Math.abs(p.x - lp.cx) > lp.halfFlatW * 0.85;
              const targetSpeed = inTurn ? 145 : 95;
              p.vx += (tx * targetSpeed - p.vx) * 5.5 * subDt;
              p.vy += (ty * targetSpeed - p.vy) * 5.5 * subDt;

              // If in bottom corridor, apply gentle magnetic pull toward any matching open box column!
              if (p.y > lp.cy + 4) {
                const { startX, boxW, gapX } = layout.boxes;
                for (let col = 0; col < 4; col++) {
                  const box = state.columns[col][0];
                  if (box && box.lidState === 'OPEN' && box.colorId === p.colorId && box.reserved < box.capacity) {
                    const boxCX = startX + col * (boxW + gapX) + boxW / 2;
                    const dxBox = boxCX - p.x;
                    if (Math.abs(dxBox) < boxW * 1.1) {
                      p.vx += dxBox * 3.5 * subDt;
                      p.vy += 85 * subDt; // Pull toward bottom edge above matching box
                    }
                  }
                }
              }

              p.x += p.vx * subDt;
              p.y += p.vy * subDt;
              p.angle += p.omega * subDt;
              p.omega *= 0.98;

              // Stadium Outer & Inner Wall Constraints (keeps cubes strictly in the white-lavender track channel!)
              const cX2 = Math.max(lp.cx - lp.halfFlatW, Math.min(lp.cx + lp.halfFlatW, p.x));
              const dx2 = p.x - cX2;
              const dy2 = p.y - lp.cy;
              const d2 = Math.hypot(dx2, dy2) || 0.001;
              const ux = dx2 / d2;
              const uy = dy2 / d2;

              const maxAllowedR = lp.outerR - rad - 4;
              const minAllowedR = lp.innerR + rad + 3;

              if (d2 > maxAllowedR) {
                p.x = cX2 + ux * maxAllowedR;
                p.y = lp.cy + uy * maxAllowedR;
                const vn = p.vx * ux + p.vy * uy;
                if (vn > 0) {
                  p.vx -= vn * ux * 1.2;
                  p.vy -= vn * uy * 1.2;
                }
              } else if (d2 < minAllowedR) {
                p.x = cX2 + ux * minAllowedR;
                p.y = lp.cy + uy * minAllowedR;
                const vn = p.vx * ux + p.vy * uy;
                if (vn < 0) {
                  p.vx -= vn * ux * 1.2;
                  p.vy -= vn * uy * 1.2;
                }
              }
            }
          }

          // 2. Pairwise Rigid-Body Cube-Cube Collision Resolution (Material Volume Congestion & Stacking!)
          for (let i = 0; i < N; i++) {
            const p1 = state.particles[i];
            for (let j = i + 1; j < N; j++) {
              const p2 = state.particles[j];
              const dx = p2.x - p1.x;
              const dy = p2.y - p1.y;
              const dSq = dx * dx + dy * dy;
              if (dSq < minDistSq && dSq > 0.0001) {
                const d = Math.sqrt(dSq);
                const overlap = (minDist - d) * 0.52;
                const nx = dx / d;
                const ny = dy / d;

                p1.x -= nx * overlap;
                p1.y -= ny * overlap;
                p2.x += nx * overlap;
                p2.y += ny * overlap;

                // Relative velocity impulse & spin transfer
                const rvx = p2.vx - p1.vx;
                const rvy = p2.vy - p1.vy;
                const vn = rvx * nx + rvy * ny;
                if (vn < 0) {
                  const imp = vn * 0.45;
                  p1.vx += nx * imp;
                  p1.vy += ny * imp;
                  p2.vx -= nx * imp;
                  p2.vy -= ny * imp;
                  // Slight angular tumble on collision
                  const vt = -rvx * ny + rvy * nx;
                  p1.omega = Math.max(-5, Math.min(5, p1.omega + vt * 0.015));
                  p2.omega = Math.max(-5, Math.min(5, p2.omega - vt * 0.015));
                }
              }
            }
          }
        }
      }

      // =========================================================================
      // 8. BOX ABSORPTION, LID CLOSING & OVERFLOW CHECK
      // =========================================================================
      function updateGameplay(dt) {
        state.handPointer.bobPhase += dt * 4.5;
        state.handPointer.x += (state.handPointer.targetX - state.handPointer.x) * Math.min(1, dt * 12);
        state.handPointer.y += (state.handPointer.targetY - state.handPointer.y) * Math.min(1, dt * 12);
        if (state.handPointer.tapAnim > 0) {
          state.handPointer.tapAnim = Math.max(0, state.handPointer.tapAnim - dt * 4);
        }
        if (state.overflowShake > 0) {
          state.overflowShake = Math.max(0, state.overflowShake - dt * 3);
        }

        // Update Bot Play (Strategic AI vs Blind Spammer Test)
        if (state.botMode && !state.gameOver && !state.victory) {
          state.botTimer -= dt;
          if (state.botTimer <= 0) {
            if (state.botMode === 'blind') {
              // Blind clicker clicks any random unblocked tile rapidly!
              const unblocked = [];
              for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                  const t = state.grid[r][c];
                  if (t && isTileUnblocked(state.grid, state.rows, state.cols, r, c, t.dir)) {
                    unblocked.push(t);
                  }
                }
              }
              if (unblocked.length > 0) {
                const pick = unblocked[Math.floor(Math.random() * unblocked.length)];
                tryActivateTile(pick.r, pick.c);
              }
              state.botTimer = 0.26;
            } else if (state.botMode === 'strategic') {
              // Strategic AI pauses if Loop load is above 95 to let matching boxes digest cubes first!
              if (state.particles.length < 95) {
                const move = findBestStrategicMove();
                if (move) {
                  tryActivateTile(move.r, move.c);
                  state.botTimer = move.matchesActive ? 0.35 : 0.65;
                } else {
                  state.botTimer = 0.3;
                }
              } else {
                state.botTimer = 0.25;
              }
            }
          }
        }

        // 1. Update grid tile recoil & highlight animations
        for (let r = 0; r < state.rows; r++) {
          for (let c = 0; c < state.cols; c++) {
            const t = state.grid[r][c];
            if (!t) continue;
            if (t.bumpTimer > 0) t.bumpTimer = Math.max(0, t.bumpTimer - dt * 4.5);
            if (t.highlightTimer > 0) t.highlightTimer = Math.max(0, t.highlightTimer - dt * 2.2);
          }
        }

        // 2. Update exiting tiles sliding off the dark board toward the U-trough wall
        for (let i = state.exitingTiles.length - 1; i >= 0; i--) {
          const ex = state.exitingTiles[i];
          ex.x += ex.vx * dt;
          ex.y += ex.vy * dt;
          const reached =
            (ex.dir === 0 && ex.y <= ex.targetY) ||
            (ex.dir === 1 && ex.x >= ex.targetX) ||
            (ex.dir === 2 && ex.y >= ex.targetY) ||
            (ex.dir === 3 && ex.x <= ex.targetX);
          if (reached) {
            crumbleTileInTrough(ex);
            state.exitingTiles.splice(i, 1);
          }
        }

        // 3. Step 240Hz Granular Physics
        stepPhysics(dt);

        // 4. Check Overflow Failure Condition (`150/150` Loop Capacity!)
        const currentLoad = state.particles.length;
        updateHUDCounters();
        if (!state.gameOver && !state.victory && currentLoad >= MAX_LOOP_CAPACITY) {
          state.gameOver = true;
          state.botMode = null;
          updateBotButtons();
          state.overflowShake = 1.0;
          sfx.playAlarmOverflow();
          setTimeout(() => {
            const modal = document.getElementById('modalOverlay');
            const card = document.getElementById('modalCard');
            card.className = 'w-full max-w-[320px] bg-white rounded-3xl p-6 text-center shadow-2xl border-4 border-rose-500';
            document.getElementById('modalIcon').textContent = '💥';
            document.getElementById('modalTitle').textContent = '轨道拥堵爆仓！';
            document.getElementById('modalDesc').textContent = `Loop 轨道滞留颗粒达到 ${currentLoad}/${MAX_LOOP_CAPACITY} 上限！请优先点击与底部 4 个收集箱颜色一致的短箭头，切勿盲目乱点。`;
            modal.classList.remove('hidden');
          }, 450);
          return;
        }

        // 5. Vacuum / Absorb matching cubes from the bottom Loop corridor into the 4 active boxes!
        const { startX, startY, boxW, boxH, gapX } = layout.boxes;
        const lp = layout.loop;

        for (let col = 0; col < 4; col++) {
          const activeBox = state.columns[col][0];
          if (!activeBox || activeBox.lidState !== 'OPEN') continue;
          if (activeBox.reserved >= activeBox.capacity) continue;

          activeBox.intakeTimer = Math.max(0, activeBox.intakeTimer - dt);
          if (activeBox.intakeTimer > 0) continue;

          const boxCenterX = startX + col * (boxW + gapX) + boxW / 2;
          // Find the closest matching cube in the bottom half of the Loop track near this box column
          let bestIdx = -1;
          let bestDist = boxW * 0.88;

          for (let i = 0; i < state.particles.length; i++) {
            const p = state.particles[i];
            if (p.zone !== 'LOOP' || p.colorId !== activeBox.colorId) continue;
            if (p.y < lp.cy + 2) continue; // Must be in the bottom channel of the Loop track!
            const dx = Math.abs(p.x - boxCenterX);
            if (dx < bestDist) {
              bestDist = dx;
              bestIdx = i;
            }
          }

          if (bestIdx !== -1) {
            const p = state.particles[bestIdx];
            state.particles.splice(bestIdx, 1);

            const unitIdx = activeBox.reserved;
            activeBox.reserved++;
            activeBox.intakeTimer = 0.028; // Realistic physical suction cadence so cubes pile up visibly above the box!

            const visualSlotIdx = Math.min(9, Math.floor((unitIdx / activeBox.capacity) * 10));
            const targetPos = getBoxVisualSlotCenter(col, 0, visualSlotIdx);

            state.leapingCubes.push({
              colorId: p.colorId,
              startX: p.x,
              startY: p.y,
              x: p.x,
              y: p.y,
              targetX: targetPos.x,
              targetY: targetPos.y,
              angle: p.angle,
              progress: 0,
              duration: 0.16,
              targetBox: activeBox
            });
          }
        }

        // 6. Update leaping cubes landing inside collection boxes
        for (let i = state.leapingCubes.length - 1; i >= 0; i--) {
          const lc = state.leapingCubes[i];
          lc.progress += dt / lc.duration;
          if (lc.progress >= 1) {
            lc.targetBox.filled++;
            sfx.playAbsorb(lc.targetBox.filled / lc.targetBox.capacity);

            // Add sparkle inside the box well
            if (lc.targetBox.sparkles.length < 8) {
              lc.targetBox.sparkles.push({
                rx: 0.12 + Math.random() * 0.76,
                ry: 0.18 + Math.random() * 0.64,
                phase: Math.random() * Math.PI * 2
              });
            }

            if (lc.targetBox.filled >= lc.targetBox.capacity && lc.targetBox.lidState === 'OPEN') {
              lc.targetBox.lidState = 'CLOSING';
              lc.targetBox.lidProgress = 0;
              sfx.playLidClose();
            }
            state.leapingCubes.splice(i, 1);
          } else {
            const t = lc.progress;
            lc.x = lc.startX + (lc.targetX - lc.startX) * t;
            lc.y = lc.startY + (lc.targetY - lc.startY) * t - Math.sin(t * Math.PI) * 10;
            lc.angle *= (1 - t);
          }
        }

        // 7. Update 3D Hinged Lid Closing Animation & Queue Push-Up (just like Col 2 in image_5fb518.jpg!)
        for (let col = 0; col < 4; col++) {
          const queue = state.columns[col];
          if (queue.length === 0) continue;
          const topBox = queue[0];

          for (let q = 0; q < queue.length; q++) {
            for (const sp of queue[q].sparkles) {
              sp.phase += dt * 5;
            }
            if (queue[q].slideOffset > 0) {
              queue[q].slideOffset = Math.max(0, queue[q].slideOffset - dt * 4.2);
            }
          }

          if (topBox.lidState === 'CLOSING') {
            topBox.lidProgress += dt * 2.1; // 0 -> 1 hinged lid swing down + pack away
            if (topBox.lidProgress >= 1.25) {
              const bx = startX + col * (boxW + gapX) + boxW / 2;
              const by = startY + boxH / 2;
              spawnBoxClearConfetti(bx, by, COLORS[topBox.colorId].top);
              queue.shift();
              for (let q = 0; q < queue.length; q++) {
                queue[q].slideOffset = 1.0;
              }
            }
          }
        }

        // 8. Update FX particles
        for (let i = state.fxParticles.length - 1; i >= 0; i--) {
          const fx = state.fxParticles[i];
          fx.x += fx.vx * dt;
          fx.y += fx.vy * dt;
          fx.vy += 190 * dt;
          fx.life -= dt;
          if (fx.life <= 0) state.fxParticles.splice(i, 1);
        }

        // 9. Check Victory (All board tiles cleared, all loop particles absorbed, all boxes finished!)
        if (!state.victory && !state.gameOver) {
          let anyTile = false;
          for (let r = 0; r < state.rows; r++) {
            for (let c = 0; c < state.cols; c++) {
              if (state.grid[r][c]) { anyTile = true; break; }
            }
          }
          const anyBox = state.columns.some(col => col.length > 0);
          if (!anyTile && state.exitingTiles.length === 0 && state.particles.length === 0 && state.leapingCubes.length === 0 && !anyBox) {
            state.victory = true;
            state.botMode = null;
            updateBotButtons();
            sfx.playLidClose();
            setTimeout(() => {
              const modal = document.getElementById('modalOverlay');
              const card = document.getElementById('modalCard');
              card.className = 'w-full max-w-[320px] bg-white rounded-3xl p-6 text-center shadow-2xl border-4 border-sky-400';
              document.getElementById('modalIcon').textContent = '🏆';
              document.getElementById('modalTitle').textContent = `Level ${state.levelNum} 完美通关！`;
              document.getElementById('modalDesc').textContent = '你精准控制了 Loop 轨道流量与颜色匹配顺序，所有收集箱全部满载封箱！';
              modal.classList.remove('hidden');
            }, 350);
          }
        }
      }

      function updateHUDCounters() {
        let totalBoxes = 0;
        for (let c = 0; c < 4; c++) totalBoxes += state.columns[c].length;
        document.getElementById('boxesLeftCount').textContent = totalBoxes;

        const load = state.particles.length;
        const dot = document.getElementById('loadDot');
        const status = document.getElementById('statusText');
        if (load >= 115) {
          dot.className = 'inline-block w-2 h-2 rounded-full bg-rose-500 animate-ping shrink-0';
          status.textContent = `⚠️ 危险！轨道滞留 ${load}/150 即将爆仓，请等待同色箱消化！`;
        } else if (load >= 75) {
          dot.className = 'inline-block w-2 h-2 rounded-full bg-amber-400 shrink-0';
          status.textContent = `轨道负载 ${load}/150 偏高，优先点击匹配底部开口箱的短箭头`;
        } else {
          dot.className = 'inline-block w-2 h-2 rounded-full bg-emerald-400 shrink-0';
          status.textContent = `轨道负载 ${load}/150 安全 · 观察底部 4 列箱子颜色再点击短箭头`;
        }
      }

      function spawnBoxClearConfetti(x, y, color) {
        for (let i = 0; i < 16; i++) {
          const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
          const spd = 60 + Math.random() * 130;
          state.fxParticles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 20,
            size: 3.5 + Math.random() * 3,
            color: i % 2 === 0 ? color : '#ffffff',
            life: 0.45 + Math.random() * 0.25,
            maxLife: 0.7
          });
        }
      }

      // =========================================================================
      // 9. STRATEGIC AI SOLVER & HINT ENGINE
      // =========================================================================
      function findBestStrategicMove() {
        const activeColors = new Set();
        const nextColors = new Set();
        const colorDeficit = [0, 0, 0, 0, 0];

        // Count how many cubes of each color are ALREADY on the Loop track
        const onTrack = [0, 0, 0, 0, 0];
        for (const p of state.particles) onTrack[p.colorId]++;

        for (let col = 0; col < 4; col++) {
          const top = state.columns[col][0];
          if (top && top.lidState === 'OPEN') {
            activeColors.add(top.colorId);
            colorDeficit[top.colorId] += (top.capacity - top.reserved);
          }
          if (state.columns[col][1]) {
            nextColors.add(state.columns[col][1].colorId);
          }
        }

        let bestCand = null;
        let bestScore = -1e9;

        for (let r = 0; r < state.rows; r++) {
          for (let c = 0; c < state.cols; c++) {
            const t = state.grid[r][c];
            if (!t) continue;
            if (!isTileUnblocked(state.grid, state.rows, state.cols, r, c, t.dir)) continue;

            let score = 0;
            const matchesActive = activeColors.has(t.colorId) && colorDeficit[t.colorId] > onTrack[t.colorId];
            if (matchesActive) {
              score += 240 + (colorDeficit[t.colorId] - onTrack[t.colorId]);
            } else if (activeColors.has(t.colorId)) {
              score += 90;
            } else if (nextColors.has(t.colorId)) {
              score += 20;
            } else {
              score -= 130; // Penalty for clicking perimeter trap tiles too early!
            }

            // Look ahead 1 step: does removing `t` unblock a desperately needed active color?
            state.grid[r][c] = null;
            for (let rr = 0; rr < state.rows; rr++) {
              for (let cc = 0; cc < state.cols; cc++) {
                const other = state.grid[rr][cc];
                if (other && isTileUnblocked(state.grid, state.rows, state.cols, rr, cc, other.dir)) {
                  if (activeColors.has(other.colorId)) score += 75;
                }
              }
            }
            state.grid[r][c] = t;

            if (score > bestScore) {
              bestScore = score;
              bestCand = { r, c, tile: t, matchesActive };
            }
          }
        }
        return bestCand;
      }

      // =========================================================================
      // 10. 1:1 VISUAL RENDERING ENGINE (Matching image_5fb518.jpg Pixel Aesthetics)
      // =========================================================================
      function drawRoundedRect(x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.arcTo(x + w, y, x + w, y + h, rad);
        ctx.arcTo(x + w, y + h, x, y + h, rad);
        ctx.arcTo(x, y + h, x, y, rad);
        ctx.arcTo(x, y, x + w, y, rad);
        ctx.closePath();
      }

      // Draws the continuous white-lavender 3D Goblet / U-Shaped Funnel + Stadium Loop Track
      function drawFunnelAndLoopArchitecture() {
        const fn = layout.funnelOuter;
        const b = layout.board;
        const lp = layout.loop;

        // 1. Outer 3D Shadow & Bevel of U-Shaped Funnel + Stadium Loop
        const traceUFunnelPath = (offsetY = 0, inset = 0) => {
          const xL = fn.x + inset;
          const xR = fn.x + fn.w - inset;
          const yT = fn.y + inset + offsetY;
          const yStraight = fn.bowlStraightBottomY + offsetY;
          const yBowl = fn.bowlBottomY + offsetY;
          const neckL = lp.cx - fn.neckW / 2 + inset * 0.6;
          const neckR = lp.cx + fn.neckW / 2 - inset * 0.6;
          const yNeckEnd = lp.y + 10 + offsetY;
          const topR = Math.max(18, 34 - inset);

          ctx.beginPath();
          ctx.moveTo(xL + topR, yT);
          ctx.lineTo(xR - topR, yT);
          ctx.quadraticCurveTo(xR, yT, xR, yT + topR);
          ctx.lineTo(xR, yStraight);
          // Smooth goblet bezier curve into central funnel throat
          ctx.bezierCurveTo(
            xR, yStraight + (yBowl - yStraight) * 0.68,
            neckR + 18, yBowl - 14,
            neckR, yBowl
          );
          ctx.lineTo(neckR, yNeckEnd);
          ctx.lineTo(neckL, yNeckEnd);
          ctx.lineTo(neckL, yBowl);
          ctx.bezierCurveTo(
            neckL - 18, yBowl - 14,
            xL, yStraight + (yBowl - yStraight) * 0.68,
            xL, yStraight
          );
          ctx.lineTo(xL, yT + topR);
          ctx.quadraticCurveTo(xL, yT, xL + topR, yT);
          ctx.closePath();
        };

        // Deep 3D outer casing shadow (`#6c7591`)
        ctx.fillStyle = '#68728e';
        traceUFunnelPath(7, -5);
        ctx.fill();

        // Outer glossy white-lavender rim (`#eef2ff`)
        const rimGrad = ctx.createLinearGradient(fn.x, fn.y, fn.x + fn.w, fn.bowlBottomY);
        rimGrad.addColorStop(0, '#eef2ff');
        rimGrad.addColorStop(0.5, '#f8faff');
        rimGrad.addColorStop(1, '#dce3f7');
        ctx.fillStyle = rimGrad;
        traceUFunnelPath(0, -3);
        ctx.fill();

        // Inner recessed lavender-white trough bowl (`#cfd8f2` -> `#e8edfb`)
        const bowlGrad = ctx.createLinearGradient(fn.x, fn.y, fn.x, fn.bowlBottomY);
        bowlGrad.addColorStop(0, '#c6d0ee');
        bowlGrad.addColorStop(0.65, '#e2e8fa');
        bowlGrad.addColorStop(1, '#eef2ff');
        ctx.fillStyle = bowlGrad;
        traceUFunnelPath(0, 3);
        ctx.fill();

        // Inner wall soft shadow line
        ctx.strokeStyle = 'rgba(130, 144, 184, 0.45)';
        ctx.lineWidth = 3;
        traceUFunnelPath(0, 3);
        ctx.stroke();

        // 2. Draw Stadium Loop Track (`#e2e8f8` with 3D outer bevel & subtle directional triangles)
        // Outer 3D base of Stadium Loop Track
        ctx.fillStyle = '#68728e';
        drawRoundedRect(lp.x - 5, lp.y - 3, lp.w + 10, lp.h + 11, lp.outerR + 5);
        ctx.fill();

        // White-lavender outer lip of Stadium Loop Track
        ctx.fillStyle = '#eef2ff';
        drawRoundedRect(lp.x - 3, lp.y - 2, lp.w + 6, lp.h + 4, lp.outerR + 3);
        ctx.fill();

        // Recessed white-lavender track floor
        const loopFloorGrad = ctx.createLinearGradient(lp.x, lp.y, lp.x, lp.y + lp.h);
        loopFloorGrad.addColorStop(0, '#d5def5');
        loopFloorGrad.addColorStop(0.5, '#e8edfb');
        loopFloorGrad.addColorStop(1, '#dce4f8');
        ctx.fillStyle = loopFloorGrad;
        drawRoundedRect(lp.x + 2, lp.y + 2, lp.w - 4, lp.h - 4, lp.outerR - 2);
        ctx.fill();

        // Re-fill throat seam connecting U-funnel bowl cleanly into top of Loop track
        ctx.fillStyle = '#e5ebfa';
        ctx.fillRect(lp.cx - fn.neckW / 2 + 4, fn.bowlBottomY - 8, fn.neckW - 8, 24);

        // Draw the 3D curved shoulder lips at the funnel throat junction (just like image_5fb518.jpg!)
        ctx.strokeStyle = '#757f9c';
        ctx.lineWidth = 6.5;
        ctx.lineCap = 'round';
        // Left throat lip
        ctx.beginPath();
        ctx.moveTo(lp.cx - fn.neckW * 1.15, lp.y - 10);
        ctx.quadraticCurveTo(lp.cx - fn.neckW * 0.45, lp.y + 1, lp.cx - fn.neckW * 0.48, lp.y + 6);
        ctx.stroke();
        // Right throat lip
        ctx.beginPath();
        ctx.moveTo(lp.cx + fn.neckW * 1.15, lp.y - 10);
        ctx.quadraticCurveTo(lp.cx + fn.neckW * 0.45, lp.y + 1, lp.cx + fn.neckW * 0.48, lp.y + 6);
        ctx.stroke();

        // Subtle grey directional triangles on the white-lavender Loop track (matching image_5fb518.jpg!)
        const drawTrackTriangle = (tx, ty, angleRad) => {
          ctx.save();
          ctx.translate(tx, ty);
          ctx.rotate(angleRad);
          ctx.fillStyle = '#aeb7d0';
          ctx.beginPath();
          ctx.moveTo(5.5, 0);
          ctx.lineTo(-4.5, -4.5);
          ctx.lineTo(-4.5, 4.5);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        };

        // Top corridor triangles (pointing left `◄` and up-right at turn)
        drawTrackTriangle(lp.cx - lp.halfFlatW * 0.52, lp.y + lp.trackWidth * 0.52, Math.PI);
        drawTrackTriangle(lp.cx + lp.halfFlatW * 0.48, lp.y + lp.trackWidth * 0.52, Math.PI);
        drawTrackTriangle(lp.cx + lp.halfFlatW + lp.outerR * 0.45, lp.cy - lp.outerR * 0.38, -Math.PI * 0.35);
        // Bottom corridor triangles
        drawTrackTriangle(lp.cx - lp.halfFlatW - lp.outerR * 0.45, lp.cy + lp.outerR * 0.42, Math.PI * 0.65);
        drawTrackTriangle(lp.cx + lp.halfFlatW * 0.42, lp.y + lp.h - lp.trackWidth * 0.48, Math.PI);
        drawTrackTriangle(lp.cx + lp.halfFlatW + lp.outerR * 0.38, lp.cy + lp.outerR * 0.45, -Math.PI * 0.15);

        // 3. Draw the Dark Slate Recessed Inner Board (`#3b4252`) inside the U-Funnel
        // Outer dark border rim (`#495062`)
        ctx.fillStyle = '#4a5264';
        drawRoundedRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8, b.r + 3);
        ctx.fill();

        // Inner dark recessed board floor (`#3c4352` - completely clean matte surface with no clutter!)
        ctx.fillStyle = '#3b4252';
        drawRoundedRect(b.x, b.y, b.w, b.h, b.r);
        ctx.fill();

        // Subtle inner top bevel shadow inside the dark board
        ctx.strokeStyle = 'rgba(25, 30, 40, 0.45)';
        ctx.lineWidth = 2.5;
        drawRoundedRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2, b.r - 1);
        ctx.stroke();
      }

      // Draws the Central Dark Horizontal Slot Bar & White-Rimmed 3D `63/150` Pill Badge
      function drawLoopCenterSlotAndCounter() {
        const lp = layout.loop;
        const sb = lp.slotBar;
        const pill = lp.pill;

        // 1. Dark Horizontal Slot Bar across the center of the Loop Track (`#454c5e`)
        ctx.fillStyle = '#373e4f';

        ctx.fill();
        ctx.fillStyle = '#485063';
        drawRoundedRect(sb.x + 2, sb.y + 1, sb.w - 4, sb.h, 5);

        // 2. White-Rimmed 3D Pill Badge (`63/150`) centered over the slot bar!
        // Outer drop shadow
        ctx.fillStyle = 'rgba(30, 41, 59, 0.35)';

        // 3D White-lavender pill outer rim (`#dce3f5` bottom bevel + `#f8faff` top rim)
        ctx.fillStyle = '#b8c3df';

        ctx.fill();

        ctx.fillStyle = '#f1f5ff';
        drawRoundedRect(pill.x, pill.y, pill.w, pill.h - 2, pill.h / 2);

        // Dark recessed interior of the pill (`#464e62`)
        const load = state.particles.length;
        const isDanger = load >= 115;
