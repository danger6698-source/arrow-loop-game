        drawRoundedRect(pill.x + 6, pill.y + 5, pill.w - 12, pill.h - 12, (pill.h - 12) / 2);
        ctx.fill();

        // Crisp white `63/150` typography
        ctx.fillStyle = isDanger ? '#fecaca' : '#ffffff';
        ctx.font = '800 13.5px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${load}/${MAX_LOOP_CAPACITY}`, lp.cx, lp.cy);
      }

      // Draws a 1x1 3D Rounded Arrow Tile on the upper board (matching image_5fb518.jpg)
      function drawArrowTile3D(cx, cy, size, colorId, dir, highlight = 0) {
        const col = COLORS[colorId];
        ctx.save();
        ctx.translate(cx, cy);

        const gap = 2.0;
        const w = size - gap * 2;
        const h = size - gap * 2;
        const x = -w / 2;
        const y = -h / 2;
        const bevelH = Math.max(5, Math.floor(size * 0.145));
        const r = Math.max(7, Math.floor(size * 0.21));

        // Soft board shadow under tile
        ctx.fillStyle = 'rgba(15, 20, 30, 0.42)';
        drawRoundedRect(x + 1, y + 3.5, w, h, r);
        ctx.fill();

        // 3D Bottom Bevel (`col.body`)
        ctx.fillStyle = col.body;
        drawRoundedRect(x, y + 2, w, h - 2, r);
        ctx.fill();

        // 3D Top Face (`col.top`)
        ctx.fillStyle = col.top;
        drawRoundedRect(x, y, w, h - bevelH, r);
        ctx.fill();

        // Subtle glossy top edge highlight
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.2;
        drawRoundedRect(x + 1, y + 1, w - 2, h - bevelH - 2, r - 1);
        ctx.stroke();

        if (highlight > 0) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${0.9 * highlight})`;
          ctx.lineWidth = 3;
          drawRoundedRect(x - 1, y - 1, w + 2, h + 2, r + 1);
          ctx.stroke();
        }

        // Chunky, rounded-corner white arrow icon centered on top face (matching image_5fb518.jpg!)
        ctx.save();
        ctx.translate(0, -bevelH * 0.45);
        ctx.rotate((dir * Math.PI) / 2);

        const s = w * 0.42;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = s * 0.22;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.beginPath();
        // Rounded triangle head + stem
        ctx.moveTo(0, -s * 0.48);
        ctx.lineTo(s * 0.44, -s * 0.04);
        ctx.lineTo(s * 0.16, -s * 0.04);
        ctx.lineTo(s * 0.16, s * 0.44);
        ctx.lineTo(-s * 0.16, s * 0.44);
        ctx.lineTo(-s * 0.16, -s * 0.04);
        ctx.lineTo(-s * 0.44, -s * 0.04);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
        ctx.restore();
      }

      // Draws a tumbled 3D mini-cube with two-tone isometric/bevel shading & rotation `angle`!
      // Look at `image_5fb518.jpg`: every shattered particle is a 3D little cube with a bright top face and darker side bevel!
      function drawTumbledMiniCube3D(x, y, size, angle, colorId) {
        const col = COLORS[colorId];
        const half = size / 2;
        const depth = size * 0.28;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // 3D Extruded Side/Bottom Bevel (shifted along world-ish down-right for volumetric 3D look)
        ctx.fillStyle = col.cubeDark;
        drawRoundedRect(-half + 1.2, -half + depth, size, size, 2.4);
        ctx.fill();

        ctx.fillStyle = col.cubeSide;
        drawRoundedRect(-half + 0.6, -half + depth * 0.55, size, size, 2.4);
        ctx.fill();

        // Bright Top Face of the 3D mini-cube
        ctx.fillStyle = col.cubeTop;
        drawRoundedRect(-half, -half, size, size * 0.88, 2.4);
        ctx.fill();

        ctx.restore();
      }

      function getBoxVisualSlotCenter(colIdx, queueIdx, slotIdx) {
        const { startX, startY, boxW, boxH, gapX, gapY } = layout.boxes;
        const bx = startX + colIdx * (boxW + gapX);
        const by = startY + queueIdx * (boxH + gapY);

        const padX = 7;
        const padY = 9;
        const innerW = boxW - padX * 2;
        const innerH = boxH - padY * 2;
        const cellW = innerW / 5;
        const cellH = innerH / 2;

        const sc = slotIdx % 5;
        const sr = Math.floor(slotIdx / 5);
        return {
          x: bx + padX + sc * cellW + cellW / 2,
          y: by + padY + sr * cellH + cellH / 2
        };
      }

      // Draws a 4-point white star sparkle (`✦`) inside active collection boxes (just like image_5fb518.jpg!)
      function drawFourPointSparkle(x, y, radius, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const ang = (i * Math.PI) / 2;
          ctx.lineTo(Math.cos(ang) * radius, Math.sin(ang) * radius);
          const midAng = ang + Math.PI / 4;
          ctx.lineTo(Math.cos(midAng) * radius * 0.32, Math.sin(midAng) * radius * 0.32);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Draws the 4 Columns of 3D Collection Boxes (with 2x5 inner grids, sparkles, and 3D Hinged Lid Closing!)
      function drawCollectionBoxColumns() {
        const { startX, startY, boxW, boxH, gapX, gapY } = layout.boxes;

        for (let colIdx = 0; colIdx < 4; colIdx++) {
          const queue = state.columns[colIdx];
          const bx = startX + colIdx * (boxW + gapX);

          // Subtle dark dock tray behind each column
          ctx.fillStyle = 'rgba(30, 36, 48, 0.45)';
          drawRoundedRect(bx - 2, startY - 3, boxW + 4, boxH * 2.4, 14);
          ctx.fill();

          const visibleBoxes = Math.min(queue.length, 3);
          for (let q = visibleBoxes - 1; q >= 0; q--) {
            const box = queue[q];
            const col = COLORS[box.colorId];
            const slideY = box.slideOffset * (boxH + gapY);
            const by = startY + q * (boxH + gapY) + slideY;

            ctx.save();

            // 1. Outer 3D Box Body & Rim
            ctx.fillStyle = col.boxDark;
            drawRoundedRect(bx, by + 4, boxW, boxH, 12);
            ctx.fill();

            ctx.fillStyle = col.boxOuterHex || col.boxOuter;
            drawRoundedRect(bx, by, boxW, boxH, 12);
            ctx.fill();

            // Top rim highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.5;
            drawRoundedRect(bx + 1, by + 1, boxW - 2, boxH - 2, 11);
            ctx.stroke();

            // 2. Inner Recessed Dark Tray with 2x5 Grid Lines (matching Blue & Yellow boxes in image_5fb518.jpg!)
            const padX = 6.5;
            const padY = 8;
            const innerW = boxW - padX * 2;
            const innerH = boxH - padY * 2;
            const ix = bx + padX;
            const iy = by + padY;

            ctx.fillStyle = col.boxWell;
            drawRoundedRect(ix, iy, innerW, innerH, 7);
            ctx.fill();

            // 2x5 Grid Dividers inside the box well
            ctx.strokeStyle = col.boxGrid;
            ctx.lineWidth = 1.3;
            const cellW = innerW / 5;
            const cellH = innerH / 2;

            ctx.save();
            drawRoundedRect(ix, iy, innerW, innerH, 7);
            ctx.clip();

            for (let c = 1; c < 5; c++) {
              ctx.beginPath();
              ctx.moveTo(ix + c * cellW, iy);
              ctx.lineTo(ix + c * cellW, iy + innerH);
              ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(ix, iy + cellH);
            ctx.lineTo(ix + innerW, iy + cellH);
            ctx.stroke();

            // 3. Draw Filled 3D Mini-Cubes packed inside the box slots!
            const numFilledCells = Math.min(10, Math.ceil((box.filled / box.capacity) * 10));
            // Fill columns left-to-right (just like the Blue box in image_5fb518.jpg where the left 2 cells are filled!)
            for (let sIdx = 0; sIdx < numFilledCells; sIdx++) {
              const sc = Math.floor(sIdx / 2); // Left-to-right column fill!
              const sr = sIdx % 2;
              const sx = ix + sc * cellW;
              const sy = iy + sr * cellH;

              ctx.fillStyle = col.cubeSide;
              drawRoundedRect(sx + 1, sy + 1, cellW - 2, cellH - 2, 3);
              ctx.fill();

              ctx.fillStyle = col.cubeTop;
              drawRoundedRect(sx + 1, sy + 1, cellW - 2, (cellH - 2) * 0.82, 3);
              ctx.fill();
            }

            // 4. Draw White 4-Point Star Sparkles (`✦`) over filled area (matching image_5fb518.jpg!)
            if (numFilledCells > 0) {
              const filledWidthRatio = Math.min(1, (numFilledCells / 10) + 0.15);
              for (const sp of box.sparkles) {
                const sx = ix + sp.rx * innerW * filledWidthRatio;
                const sy = iy + sp.ry * innerH;
                const alpha = 0.45 + 0.55 * Math.abs(Math.sin(sp.phase));
                drawFourPointSparkle(sx, sy, 3.8, alpha);
              }
            }

            ctx.restore();

            // 5. 3D Hinged Top Pillow Lid Closing Animation (1:1 matched to Col 1 Pink Box in image_5fb518.jpg!)
            if (box.lidState === 'CLOSING') {
              const lidP = Math.min(1, box.lidProgress);
              const capH = Math.max(22, boxH * 0.62);
              const lidY = by - 16 + lidP * 14;

              // Deep drop shadow cast by the 3D lid onto the box grid below
              ctx.fillStyle = 'rgba(15, 20, 35, 0.35)';
              drawRoundedRect(bx - 1, lidY + 6, boxW + 2, capH, 13);
              ctx.fill();

              // 3D Darker Bottom Lip of the Lid
              ctx.fillStyle = col.boxDark;
              drawRoundedRect(bx - 1, lidY + 3, boxW + 2, capH, 13);
              ctx.fill();

              // Bright Glossy 3D Top Pillow Face of the Lid
              ctx.fillStyle = col.top;
              drawRoundedRect(bx - 1, lidY, boxW + 2, capH - 4, 13);
              ctx.fill();

              // Subtle top specular highlight on the Lid
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
              ctx.lineWidth = 1.5;
              drawRoundedRect(bx + 1, lidY + 1.5, boxW - 2, capH - 7, 11);
              ctx.stroke();
            }

            ctx.restore();
          }
        }
      }

      // Draws the Iconic 3D White Cartoon Glove Hand Cursor (`👆`) from image_5fb518.jpg!
      function drawCartoonGloveHand() {
        if (!state.handPointer.visible) return;
        const hp = state.handPointer;
        const bob = Math.sin(hp.bobPhase) * 3.5;
        const tapScale = 1 - Math.sin(hp.tapAnim * Math.PI) * 0.14;

        ctx.save();
        ctx.translate(hp.x, hp.y + bob);
        ctx.scale(tapScale, tapScale);
        ctx.rotate(-0.18); // Slight jaunty angle matching image_5fb518.jpg!

        // Drop shadow
        ctx.shadowColor = 'rgba(15, 23, 42, 0.45)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = -3;
        ctx.shadowOffsetY = 6;

        // Soft 3D white-blue glove gradient
        const gloveGrad = ctx.createLinearGradient(-18, -32, 20, 26);
        gloveGrad.addColorStop(0, '#ffffff');
        gloveGrad.addColorStop(0.65, '#e6f0fa');
        gloveGrad.addColorStop(1, '#b8cde0');

        ctx.fillStyle = gloveGrad;
        ctx.strokeStyle = '#9bb4cc';
        ctx.lineWidth = 1.5;

        // Index finger + curled fingers + palm silhouette
        ctx.beginPath();
        // Index finger pointing up
        ctx.moveTo(-10, -4);
        ctx.lineTo(-10, -32);
        ctx.arc(-3, -32, 7, Math.PI, 0, false);
        ctx.lineTo(4, -10);
        // Middle finger knuckle
        ctx.arc(10, -8, 6, Math.PI, 0, false);
        // Ring finger knuckle
        ctx.arc(21, -5, 5.5, Math.PI, 0, false);
        // Little finger knuckle & right side of palm
        ctx.arc(30, -1, 5, Math.PI, 0, false);
        ctx.quadraticCurveTo(36, 14, 24, 24);
        ctx.lineTo(-4, 24);
        // Left thumb tuck
        ctx.quadraticCurveTo(-22, 18, -20, 2);
        ctx.quadraticCurveTo(-19, -5, -10, -4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Reset shadow for cuff
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;

        // 3D Wrist Cuff Ring at bottom of glove (matching image_5fb518.jpg!)
        ctx.save();
        ctx.translate(10, 25);
        ctx.rotate(0.12);
        ctx.fillStyle = '#dce8f5';
        ctx.strokeStyle = '#9bb4cc';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#8fa6bf';
        ctx.beginPath();
        ctx.ellipse(0, 1.5, 9.5, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      function render() {
        ctx.save();
        ctx.scale(layout.dpr, layout.dpr);

        if (state.overflowShake > 0) {
          const sx = (Math.random() - 0.5) * 8 * state.overflowShake;
          const sy = (Math.random() - 0.5) * 8 * state.overflowShake;
          ctx.translate(sx, sy);
        }

        ctx.clearRect(0, 0, layout.w, layout.h);

        // 1. Draw U-Shaped White-Lavender Funnel, Stadium Loop Track & Dark Inner Board
        drawFunnelAndLoopArchitecture();

        // 2. Draw Grid Arrow Tiles on the Dark Board
        const cs = layout.board.cellSize;
        for (let r = 0; r < state.rows; r++) {
          for (let c = 0; c < state.cols; c++) {
            const tile = state.grid[r][c];
            if (!tile) continue;
            const center = getTileScreenCenter(r, c);
            let ox = 0, oy = 0;
            if (tile.bumpTimer > 0) {
              const d = DIRS[tile.bumpDir];
              const wave = Math.sin(tile.bumpTimer * Math.PI * 2) * 5.5 * tile.bumpTimer;
              ox = d.dc * wave;
              oy = d.dr * wave;
            }
            drawArrowTile3D(center.x + ox, center.y + oy, cs, tile.colorId, tile.dir, tile.highlightTimer);
          }
        }

        // 3. Draw Exiting Tiles sliding into the outer U-trough
        for (const ex of state.exitingTiles) {
          drawArrowTile3D(ex.x, ex.y, cs * 0.92, ex.colorId, ex.dir, 0);
        }

        // 4. Draw All Physical 3D Tumbled Mini-Cubes in the U-Funnel & Stadium Loop Track!
        const cubeSz = layout.cubeSize;
        for (let i = 0; i < state.particles.length; i++) {
          const p = state.particles[i];
          drawTumbledMiniCube3D(p.x, p.y, cubeSz, p.angle, p.colorId);
        }

        // 5. Draw Central Dark Slot Bar & White-Rimmed `63/150` Pill ON TOP OF track inner edges
        drawLoopCenterSlotAndCounter();

        // 6. Draw Bottom 4 Columns of Collection Boxes (with 2x5 grids, sparkles & closing lids)
        drawCollectionBoxColumns();

        // 7. Draw Leaping Cubes entering boxes & Confetti FX
        for (const lc of state.leapingCubes) {
          drawTumbledMiniCube3D(lc.x, lc.y, cubeSz * 0.95, lc.angle, lc.colorId);
        }

        for (const fx of state.fxParticles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, fx.life / fx.maxLife);
          ctx.fillStyle = fx.color;
          ctx.translate(fx.x, fx.y);
          ctx.fillRect(-fx.size / 2, -fx.size / 2, fx.size, fx.size);
          ctx.restore();
        }

        // 8. Draw 3D White Cartoon Glove Hand Cursor
        drawCartoonGloveHand();

        ctx.restore();
      }

      // =========================================================================
      // 11. INPUT HANDLERS & CONTROLS
      // =========================================================================
      function showToast(msg) {
        const el = document.getElementById('toastMsg');
        el.textContent = msg;
        el.classList.remove('opacity-0');
        el.classList.add('opacity-100');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => {
          el.classList.remove('opacity-100');
          el.classList.add('opacity-0');
        }, 2000);
      }

      function updateBotButtons() {
        const btnStrat = document.getElementById('btnAutoDemo');
        const btnBlind = document.getElementById('btnBlindTest');

        if (state.botMode === 'strategic') {
          btnStrat.textContent = '⏸ 停止AI';
          btnStrat.className = 'btn-3d px-2.5 py-0.5 rounded-full bg-emerald-600 text-white text-[10px] font-extrabold border border-white/60';
        } else {
          btnStrat.textContent = '🤖 策略AI';
          btnStrat.className = 'btn-3d px-2.5 py-0.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-extrabold border border-white/40';
        }

        if (state.botMode === 'blind') {
          btnBlind.textContent = '⏸ 停止瞎点';
          btnBlind.className = 'btn-3d px-2 py-0.5 rounded-full bg-amber-600 text-white text-[10px] font-extrabold border border-white/60';
        } else {
          btnBlind.textContent = '⚡ 瞎点测试';
          btnBlind.className = 'btn-3d px-2 py-0.5 rounded-full bg-rose-600/90 hover:bg-rose-500 text-white text-[10px] font-extrabold border border-white/40';
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const b = layout.board;
        const c = Math.floor((x - b.gridX) / b.cellSize);
        const r = Math.floor((y - b.gridY) / b.cellSize);

        if (r >= 0 && r < state.rows && c >= 0 && c < state.cols) {
          if (state.botMode) {
            state.botMode = null;
            updateBotButtons();
          }
          tryActivateTile(r, c);
        }
      });

      document.getElementById('btnPrevLevel').addEventListener('click', () => {
        const nextLvl = currentLevelNum <= 1 ? 20 : currentLevelNum - 1;
        initLevel(nextLvl);
      });

      document.getElementById('btnNextLevel').addEventListener('click', () => {
        initLevel(currentLevelNum + 1);
      });

      document.getElementById('btnHint').addEventListener('click', () => {
        const best = findBestStrategicMove();
        if (best && best.tile) {
          best.tile.highlightTimer = 2.0;
          const center = getTileScreenCenter(best.r, best.c);
          state.handPointer.targetX = center.x + 14;
          state.handPointer.targetY = center.y + 22;
          state.handPointer.visible = true;
          showToast(
            best.matchesActive
              ? `👆 白手套已指向第 ${best.r + 1} 行第 ${best.c + 1} 列（${COLORS[best.tile.colorId].name}块，匹配当前开口箱！）`
              : `👆 建议先移开第 ${best.r + 1} 行第 ${best.c + 1} 列的阻挡块以解锁内部同色块`
          );
        } else {
          showToast('请稍候，让轨道内的微颗粒先被底部同色收集箱吸收！');
        }
      });

      document.getElementById('btnRestart').addEventListener('click', () => {
        initLevel(currentLevelNum);
        showToast('已重置当前关卡');
      });

      document.getElementById('btnMute').addEventListener('click', () => {
        sfx.muted = !sfx.muted;
        document.getElementById('btnMute').textContent = sfx.muted ? '🔇' : '🔊';
      });

      document.getElementById('btnAutoDemo').addEventListener('click', () => {
        state.botMode = state.botMode === 'strategic' ? null : 'strategic';
        state.botTimer = 0.05;
        updateBotButtons();
        if (state.botMode === 'strategic') {
          showToast('🤖 策略AI已启动：自动匹配底部开口收集箱颜色并控制 150 轨道上限');
        }
      });

      document.getElementById('btnBlindTest').addEventListener('click', () => {
        state.botMode = state.botMode === 'blind' ? null : 'blind';
        state.botTimer = 0.05;
        updateBotButtons();
        if (state.botMode === 'blind') {
          showToast('⚡ 无脑瞎点测试中：随意乱点不匹配的短箭头将迅速挤爆 150/150 轨道容量！');
        }
      });

      document.getElementById('btnModalRetry').addEventListener('click', () => {
        initLevel(currentLevelNum);
      });

      document.getElementById('btnModalNext').addEventListener('click', () => {
        if (state.gameOver) {
          initLevel(currentLevelNum);
        } else {
          initLevel(currentLevelNum + 1);
        }
      });

      window.addEventListener('resize', () => {
        computeLayout();
      });

      // =========================================================================
      // 12. MAIN LOOP
      // =========================================================================
      let lastTime = performance.now();
      let rafId = null;

      function frame(now) {
        const dt = Math.min(0.04, (now - lastTime) / 1000);
        lastTime = now;
        updateGameplay(dt);
        render();
        rafId = requestAnimationFrame(frame);
      }

      window.addEventListener('load', () => {
        initLevel(15); // Boot into Level 15 (exact 63/150 screenshot replica!)
        lastTime = performance.now();
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
